name: Daily Padel Court Booking

on:
  schedule:
    # 19:55 UTC = 11:55 PM GST (Dubai Time)
    - cron: '55 19 * * *'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run booking script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
        run: |
          python book_padel.py
