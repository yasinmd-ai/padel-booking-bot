name: Daily Padel Court Booking

on:
  schedule:
    - cron: '0 20 * * *'  # Runs daily at 12:00 AM GST (Dubai Time)
  workflow_dispatch:      # Enables manual trigger button

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Execute Booking Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
        run: python book_padel.py
