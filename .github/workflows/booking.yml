Name: Book Court

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (skip midnight wait, target +2 days)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '45 19 * * *' # Runs daily at 11:45 PM GST (19:45 UTC)

jobs:
  book-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright aiohttp
          playwright install --with-deps chromium

      - name: Execute Booking API Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python book_padel.py
