name: Automated Padel Booking API

on:
  schedule:
    # Runs daily at 19:56 UTC (23:56 GST / Dubai Time)
    - cron: '56 19 * * *'
  workflow_dispatch:

jobs:
  book-court:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp
          playwright install --with-deps chromium

      - name: Execute Booking API Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
        run: |
          python book_padel_api.py
