name: Book Court

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (skip midnight wait)'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Run in dry run mode (stop before final click)'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '30 19 * * *' # 11:30 PM GST buffer

jobs:
  book-court:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright aiohttp
          playwright install chromium

      - name: Syntax check
        run: python -m py_compile book_padel.py

      - name: Execute Booking API Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python book_padel.py

      - name: Upload screenshots & HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-debug-artifacts
          path: |
            *.png
            *.html
          if-no-files-found: ignore
