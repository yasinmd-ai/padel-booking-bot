name: Book Padel Court

on:
  schedule:
    # 19:50 UTC = 23:50 GST (Dubai Time)
    - cron: '50 19 * * *'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp
          playwright install chromium

      - name: Run Booking Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
        run: |
          python book_padel.py

      - name: Upload Booking Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: "*.png"
          if-no-files-found: ignore
