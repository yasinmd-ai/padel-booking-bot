name: Book Court

on:
  workflow_dispatch:
  schedule:
    - cron: '55 19 * * *' # Runs nightly before midnight GST

jobs:
  book-court:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright aiohttp
          playwright install chromium

      - name: Syntax check
        run: python -m py_compile book_padel.py

      - name: Execute Booking Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
          TEST_MODE: "true" # Change to false when you want live bookings
          DRY_RUN: "true"   # Change to false when you want live bookings
        run: python book_padel.py

      - name: Upload screenshots & HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            *.png
            *.html
