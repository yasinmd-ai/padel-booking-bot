name: Daily Padel Court Booking

on:
  schedule:
    # Triggers at 11:55 PM GST (Dubai Time) every night
    - cron: '55 19 * * *'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run booking script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
        run: python book_padel.py
