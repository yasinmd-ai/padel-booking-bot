name: Book Court

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (skip midnight wait)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *' # Fires at 18:00 UTC (10:00 PM GST) for safe GitHub runner queue buffers

jobs:
  book-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install playwright aiohttp
          playwright install chromium

      - name: Execute Booking API Script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python book_padel.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: "*.png"
