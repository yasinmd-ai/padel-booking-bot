name: Daily Padel Court Booking

on:
  schedule:
    # Triggers at 11:50 PM GST (19:50 UTC) to absorb GitHub delay
    - cron: '50 19 * * *'
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run booking script
        env:
          DAMAC_USERNAME: ${{ secrets.DAMAC_USERNAME }}
          DAMAC_PASSWORD: ${{ secrets.DAMAC_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: python book_padel.py
